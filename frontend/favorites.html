<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yêu thích – Thuê bạn đồng hành</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo" style="margin-bottom: 40px;"><i class="fa-solid fa-fan" style="color: #fca5a5; font-size: 28px;"></i></div>
      <nav class="sidebar-nav">
        <a href="./index.html" class="nav-item" title="Trang chủ">
          <i class="fa-solid fa-book-open"></i>
          <span>Booking</span>
        </a>
        <a href="#" class="nav-item" title="Tìm kiếm">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Tìm kiếm</span>
        </a>
        <a href="#" class="nav-item" title="Lịch hẹn">
          <i class="fa-solid fa-calendar-check"></i>
          <span>Lịch hẹn</span>
        </a>
        <a href="./favorites.html" class="nav-item active" title="Yêu thích">
          <i class="fa-solid fa-heart"></i>
          <span>Yêu thích</span>
        </a>
        <a href="#" class="nav-item" title="Đánh giá">
          <i class="fa-solid fa-star"></i>
          <span>Đánh giá</span>
        </a>
        <a href="#" class="nav-item" title="Báo cáo">
          <i class="fa-solid fa-bullhorn"></i>
          <span>Báo cáo</span>
        </a>
      </nav>
      <div class="sidebar-bottom">
        <a href="#" class="nav-item"><i class="fa-solid fa-user"></i></a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container" style="padding-top: 40px;">
        <div class="page-header" style="padding: 0 0 20px 0;">
          <h1 class="page-title" style="font-size: 24px; font-weight: 700;">❤️ Danh sách yêu thích</h1>
          <p class="page-subtitle" id="favoritesSubtitle" style="font-size: 14px; opacity: 0.9;">Bạn có 0 bạn đồng hành yêu thích</p>
          <div style="margin-top: 8px;">
             <span id="favoritesStatus" class="status" style="color: white; font-size: 14px;">Đang tải...</span>
          </div>
        </div>

        <div id="favoritesEmpty" class="empty" hidden>
          <div class="emptyTitle">Chưa có mục yêu thích</div>
          <div class="emptySubtitle">Quay lại trang chủ để thêm bạn đồng hành vào danh sách.</div>
          <div class="emptyActions">
            <a class="btn btn-primary" href="./index.html"><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a>
          </div>
        </div>

        <div id="favoritesList" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;"></div>
        <br><br>
      </div>
    </main>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/favorites.js"></script>
</body>
</html>
