<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý lịch hẹn - Web cho thuê bạn đồng hành</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .container {
            width: 1920px;
            height: 1215px;
            position: relative;
            background: white;
            overflow: hidden;
        }
        .background-img {
            width: 3108px;
            height: 1744px;
            left: -470px;
            top: 0px;
            position: absolute;
            object-fit: cover;
        }
        .sidebar {
            width: 115px;
            height: 1213px;
            padding: 20px 0;
            left: 0px;
            top: 2px;
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-right: 1px rgba(255, 255, 255, 0.30) solid;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        .sidebar-item {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }
        .sidebar-item.active {
            background: rgba(255, 255, 255, 0.30);
        }
        .sidebar-icon {
            font-size: 24px;
        }
        .sidebar-text {
            font-size: 9px;
            text-align: center;
        }
        .back-button {
            width: 900px;
            height: 19px;
            left: 188px;
            top: 85px;
            position: absolute;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }
        .page-title {
            left: 188px;
            top: 130px;
            position: absolute;
            color: white;
            font-size: 40px;
            font-weight: 600;
        }
        .subtitle {
            left: 192px;
            top: 188px;
            position: absolute;
            color: white;
            font-size: 24px;
            font-weight: 600;
        }
        .filter-bar {
            width: 965px;
            height: 90px;
            left: 830px;
            top: 121px;
            position: absolute;
            background: rgba(243.97, 245.44, 255, 0.43);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
        }
        .filter-item {
            padding: 15px 30px;
            border-radius: 23px;
            font-size: 24px;
            font-weight: 600;
            cursor: pointer;
            color: black;
            background: transparent;
        }
        .filter-item.active {
            background: white;
        }
        .appointment-list {
            position: absolute;
            left: 192px;
            top: 254px;
            width: 1603px;
            display: flex;
            flex-direction: column;
            gap: 37px;
        }
        .appointment-card {
            width: 1603px;
            height: 160px;
            background: rgba(255, 242.74, 242.74, 0.65);
            border-radius: 25px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }
        .avatar {
            width: 91px;
            height: 91px;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-right: 30px;
        }
        .info-main {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .name {
            font-size: 32px;
            font-weight: 400;
            color: black;
        }
        .details {
            display: flex;
            gap: 30px;
            font-size: 20px;
            color: black;
        }
        .status-badge {
            padding: 5px 20px;
            border-radius: 44px;
            font-size: 20px;
            font-weight: 800;
            margin-left: 20px;
        }
        .status-confirmed { background: #DCFCE7; color: #16A34A; }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-completed { background: #E0E7FF; color: #4F46E5; }
        .status-cancelled { background: #FEE2E2; color: #DC2626; }
        
        .actions {
            margin-left: auto;
            display: flex;
            gap: 20px;
        }
        .action-btn {
            padding: 15px 25px;
            border-radius: 32px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            min-width: 100px;
        }
        .btn-cancel { background: #CC8E8E; color: #FF0000; }
        .btn-chat { background: #CC8E8E; color: #5751FF; }
        .btn-view { background: #CC8E8E; color: #5751FF; }
        .btn-rate { background: rgba(86.79, 81.75, 232.93, 0.66); color: #F9F9F9; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Use the provided background image -->
        <img class="background-img" src="../99790 1.png" alt="Background" />

        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div style="padding-bottom: 20px;"><span style="font-size: 32px;">🌸</span></div>
            <a href="booking.html" class="sidebar-item">
                <div class="sidebar-icon">📘</div>
                <div class="sidebar-text">Booking</div>
            </a>
            <a href="#" class="sidebar-item">
                <div class="sidebar-icon">🔍</div>
                <div class="sidebar-text">Tìm kiếm</div>
            </a>
            <a href="appointments.html" class="sidebar-item active">
                <div class="sidebar-icon">📅</div>
                <div class="sidebar-text">Lịch hẹn</div>
            </a>
            <a href="#" class="sidebar-item">
                <div class="sidebar-icon">❤️</div>
                <div class="sidebar-text">Yêu thích</div>
            </a>
            <a href="#" class="sidebar-item">
                <div class="sidebar-icon">⭐</div>
                <div class="sidebar-text">Đánh giá</div>
            </a>
            <a href="#" class="sidebar-item">
                <div class="sidebar-icon">📢</div>
                <div class="sidebar-text">Báo cáo</div>
            </a>
        </div>

        <div class="back-button" onclick="window.history.back()">← Quay lại</div>
        <div class="page-title">📋 Quản lý lịch hẹn</div>
        <div class="subtitle">Theo dõi và quản lý các cuộc hẹn của bạn</div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-item active">Tất cả</div>
            <div class="filter-item">Sắp tới</div>
            <div class="filter-item">Đã hoàn thành</div>
            <div class="filter-item">Đã hủy</div>
        </div>

        <!-- Appointment List -->
        <div class="appointment-list">
            <!-- Appointments will be rendered here dynamically -->
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const appointmentListElem = document.querySelector('.appointment-list');
        const filterItems = document.querySelectorAll('.filter-item');

        async function loadAppointments(status = '') {
            try {
                // For demo purposes, we'll use 'user123' as the placeholder userId
                const appointments = await api.getBookings('user123', status);
                renderAppointments(appointments);
            } catch (error) {
                console.error('Failed to load appointments:', error);
            }
        }

        function renderAppointments(appointments) {
            if (appointments.length === 0) {
                appointmentListElem.innerHTML = '<div style="color: white; font-size: 24px; text-align: center; margin-top: 50px;">Bạn chưa có lịch hẹn nào.</div>';
                return;
            }

            appointmentListElem.innerHTML = appointments.map(app => `
                <div class="appointment-card">
                    <div class="avatar">${app.companionName.includes('Lan') ? '👩' : '👨'}</div>
                    <div class="info-main">
                        <div class="name">${app.companionName}</div>
                        <div class="details">
                            <span>📅 ${new Date(app.date).toLocaleDateString('vi-VN')}</span>
                            <span>🕐 ${app.startTime} - ${app.endTime}</span>
                            <span>${app.service}</span>
                            <span>💰 ${app.totalPrice.toLocaleString('vi-VN')}đ</span>
                            <span class="status-badge status-${app.status}">
                                ${app.status === 'confirmed' ? '✓ Đã xác nhận' : 
                                  app.status === 'pending' ? '⏳ Chờ xác nhận' : 
                                  app.status === 'completed' ? '✓ Hoàn thành' : '✕ Đã hủy'}
                            </span>
                        </div>
                    </div>
                    <div class="actions">
                        ${app.status === 'pending' || app.status === 'confirmed' ? `
                            <div class="action-btn btn-chat">💬 Chat</div>
                            <div class="action-btn btn-cancel" onclick="cancelBooking('${app._id}')">✕ Hủy</div>
                        ` : app.status === 'completed' ? `
                            <div class="action-btn btn-rate">⭐ Đánh giá</div>
                        ` : `
                            <div class="action-btn btn-view">👁️ Chi tiết</div>
                        `}
                    </div>
                </div>
            `).join('');
        }

        async function cancelBooking(id) {
            if (confirm('Bạn có chắc chắn muốn hủy lịch hẹn này?')) {
                try {
                    await api.updateBookingStatus(id, 'cancelled');
                    loadAppointments(); // Reload list
                } catch (error) {
                    alert('Lỗi khi hủy lịch hẹn.');
                }
            }
        }

        filterItems.forEach(item => {
            item.addEventListener('click', function() {
                filterItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                let status = '';
                const text = this.innerText;
                if (text === 'Sắp tới') status = 'confirmed';
                else if (text === 'Đã hoàn thành') status = 'completed';
                else if (text === 'Đã hủy') status = 'cancelled';
                
                loadAppointments(status);
            });
        });

        // Initial load
        loadAppointments();
    </script>
</body>
</html>
