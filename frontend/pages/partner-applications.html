<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn đăng ký - Website thuê bạn đồng hành</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            background-color: #0f172a;
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.72)), url("/assets/99790-1.png");
            background-size: cover, cover;
            background-position: center, center;
            background-attachment: fixed, fixed;
            background-repeat: no-repeat, no-repeat;
        }
        .sidebar { width: 250px; background: #2c3e50; color: white; min-height: 100vh; padding: 20px; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 30px; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li { padding: 12px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .sidebar li:hover { background: #34495e; }
        .sidebar li.active { background: #3498db; }
        .sidebar a { color: white; text-decoration: none; display: block; }
        
        .main-content { flex: 1; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn { padding: 8px 15px; border-radius: 4px; cursor: pointer; border: none; font-size: 0.9rem; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-info { background: #3498db; color: white; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #666; font-weight: 600; }
        
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .badge-pending { background: #f1c40f; color: white; }
        .badge-approved { background: #2ecc71; color: white; }
        .badge-rejected { background: #e74c3c; color: white; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 500px; max-height: 90vh; overflow-y: auto; }
        .detail-row { margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; }
        .detail-label { font-weight: bold; color: #7f8c8d; font-size: 0.9rem; }
        .detail-value { color: #2c3e50; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>ADMIN PANEL</h2>
        <ul>
            <li><a href="categories.html"><i class="fas fa-folder"></i> Danh mục</a></li>
            <li class="active"><a href="partner-applications.html"><i class="fas fa-user-tie"></i> Đơn đăng ký Partner</a></li>
            <li><a href="index.html"><i class="fas fa-home"></i> Quay lại Home</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>🤝 Quản lý đơn đăng ký Partner</h1>
        </div>

        <table id="applicationTable">
            <thead>
                <tr>
                    <th>Ngày đăng ký</th>
                    <th>Họ Tên</th>
                    <th>Số điện thoại</th>
                    <th>Email</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="applicationBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <h2>Chi tiết đơn đăng ký</h2>
            <div id="applicationDetail"></div>
            <hr>
            <h3>Phê duyệt đơn</h3>
            <form id="reviewForm">
                <input type="hidden" id="reviewAppId">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Ghi chú phản hồi</label>
                    <textarea id="reviewNotes" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn" onclick="hideModal()" style="background: #bdc3c7;">Đóng</button>
                    <button type="button" class="btn btn-danger" onclick="submitReview('rejected')">Từ chối</button>
                    <button type="button" class="btn btn-success" onclick="submitReview('approved')">Phê duyệt</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import api from './js/api.js';

        const applicationBody = document.getElementById('applicationBody');
        const modal = document.getElementById('reviewModal');
        const detailDiv = document.getElementById('applicationDetail');

        async function loadApplications() {
            const apps = await api.getPartnerApplications();
            applicationBody.innerHTML = apps.map(app => `
                <tr>
                    <td>${new Date(app.createdAt).toLocaleDateString('vi-VN')}</td>
                    <td><strong>${app.fullName}</strong></td>
                    <td>${app.phoneNumber}</td>
                    <td>${app.email}</td>
                    <td><span class="badge badge-${app.status}">${app.status.toUpperCase()}</span></td>
                    <td>
                        <button class="btn btn-info" onclick="window.showDetail('${app._id}')"><i class="fas fa-eye"></i> Xem chi tiết</button>
                    </td>
                </tr>
            `).join('');
        }

        window.showDetail = async (id) => {
            const apps = await api.getPartnerApplications();
            const app = apps.find(a => a._id === id);
            
            detailDiv.innerHTML = `
                <div class="detail-row"><div class="detail-label">Họ Tên:</div><div class="detail-value">${app.fullName}</div></div>
                <div class="detail-row"><div class="detail-label">Số điện thoại:</div><div class="detail-value">${app.phoneNumber}</div></div>
                <div class="detail-row"><div class="detail-label">Email:</div><div class="detail-value">${app.email}</div></div>
                <div class="detail-row"><div class="detail-label">Giới thiệu:</div><div class="detail-value">${app.bio}</div></div>
                <div class="detail-row"><div class="detail-label">Kỹ năng:</div><div class="detail-value">${app.skills.join(', ')}</div></div>
                <div class="detail-row"><div class="detail-label">Kinh nghiệm:</div><div class="detail-value">${app.experience || 'N/A'}</div></div>
            `;
            document.getElementById('reviewAppId').value = id;
            document.getElementById('reviewNotes').value = app.reviewNotes || '';
            modal.style.display = 'flex';
        };

        window.hideModal = () => {
            modal.style.display = 'none';
        };

        window.submitReview = async (status) => {
            const id = document.getElementById('reviewAppId').value;
            const reviewNotes = document.getElementById('reviewNotes').value;
            
            await api.reviewPartnerApplication(id, { status, reviewNotes });
            hideModal();
            loadApplications();
        };

        loadApplications();
    </script>
</body>
</html>
