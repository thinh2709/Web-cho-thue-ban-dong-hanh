<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thống kê thu nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --glass: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.3);
        --shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        --radius: 18px;
        --font: 'Inter', system-ui, sans-serif;
        --green: #16a34a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        color: #111827;
      }

      .page-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(135deg, rgb(240, 147, 251) 0%, rgb(245, 87, 108) 50%, rgb(240, 147, 251) 100%);
      }

      .page-bg img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.78;
      }

      .layout {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 72px;
        flex-shrink: 0;
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.12);
        border-right: 1px solid var(--glass-border);
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .sidebar a {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #fff;
        font-size: 9px;
        width: 56px;
        padding: 8px 0;
        border-radius: 14px;
      }

      .sidebar a .icon {
        font-size: 22px;
        margin-bottom: 4px;
      }

      .sidebar a.active {
        background: rgba(255, 255, 255, 0.28);
      }

      .main {
        flex: 1;
        padding: 40px 40px 48px 32px;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }

      .title {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        color: #fff;
      }

      .range-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .range-wrap select,
      .range-wrap input {
        font-family: var(--font);
        border-radius: 10px;
        border: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 10px 14px;
        font-size: 14px;
      }

      .range-wrap option {
        color: #111;
      }

      .range-wrap input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      }

      .card {
        position: relative;
        backdrop-filter: blur(10px);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
        min-height: 160px;
        color: #fff;
      }

      .card-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-bottom: 16px;
      }

      .card-icon.mint {
        background: #dcfce7;
      }

      .card-icon.blue {
        background: #dbeafe;
      }

      .card-icon.amber {
        background: #fef3c7;
      }

      .card-icon.rose {
        background: #ffe4e6;
      }

      .card-value {
        font-size: 26px;
        font-weight: 700;
        margin: 0 0 6px;
      }

      .card-label {
        margin: 0 0 8px;
        font-size: 14px;
        opacity: 0.92;
      }

      .card-trend {
        margin: 0;
        font-size: 12px;
        color: #bbf7d0;
        font-weight: 600;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
        gap: 20px;
        align-items: stretch;
      }

      @media (max-width: 960px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        backdrop-filter: blur(10px);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px 22px;
        color: #fff;
      }

      .panel h2 {
        margin: 0 0 16px;
        font-size: 18px;
        font-weight: 700;
      }

      .chart-wrap {
        position: relative;
        height: 280px;
      }

      .side-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: 100%;
      }

      .tx-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .tx-head a {
        color: #fecaca;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }

      .tx-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .tx-item {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        color: #111827;
        flex-shrink: 0;
      }

      .tx-meta {
        flex: 1;
        min-width: 0;
      }

      .tx-name {
        margin: 0;
        font-weight: 600;
        font-size: 14px;
      }

      .tx-date {
        margin: 2px 0 0;
        font-size: 12px;
        opacity: 0.85;
      }

      .tx-amount {
        font-weight: 700;
        color: #bbf7d0;
        font-size: 14px;
        white-space: nowrap;
      }

      .withdraw {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--glass-border);
      }

      .withdraw-label {
        font-size: 13px;
        opacity: 0.9;
        margin: 0 0 6px;
      }

      .withdraw-value {
        font-size: 22px;
        font-weight: 800;
        margin: 0 0 12px;
      }

      .btn-withdraw {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-family: var(--font);
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(90deg, #f472b6, #fb923c);
      }

      .error {
        background: rgba(254, 226, 226, 0.95);
        color: #991b1b;
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 16px;
      }

      .loading {
        color: #fff;
        margin-bottom: 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <img src="https://www.figma.com/api/mcp/asset/cf904793-f043-4069-a97c-217e53614452" alt="" />
    </div>
    <div class="layout">
      <aside class="sidebar" aria-label="Điều hướng">
        <a href="reports.html" class="active" title="Thống kê">
          <span class="icon" aria-hidden="true">💰</span>
          <span>Thu nhập</span>
        </a>
        <a href="pricing.html" title="Giá cả">
          <span class="icon" aria-hidden="true">🏷️</span>
          <span>Giá cả</span>
        </a>
      </aside>
      <main class="main">
        <div class="header-row">
          <h1 class="title">💰 Thống kê thu nhập</h1>
          <div class="range-wrap">
            <label for="preset-range" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Khoảng thời gian</label>
            <select id="preset-range" aria-label="Chọn khoảng thời gian">
              <option value="last_6_months" selected>6 tháng gần nhất</option>
              <option value="this_month">Tháng này</option>
              <option value="last_month">Tháng trước</option>
              <option value="last_7">7 ngày qua</option>
              <option value="custom">Tùy chỉnh</option>
            </select>
            <input type="date" id="from-date" hidden />
            <input type="date" id="to-date" hidden />
          </div>
        </div>
        <div id="loading" class="loading" hidden>Đang tải số liệu…</div>
        <div id="error-box" class="error" hidden></div>

        <section class="cards" id="summary-cards" aria-live="polite"></section>

        <div class="grid-2">
          <section class="panel">
            <h2>📊 Biểu đồ thu nhập</h2>
            <div class="chart-wrap">
              <canvas id="revenue-chart" aria-label="Biểu đồ doanh thu"></canvas>
            </div>
          </section>
          <div class="side-stack">
            <section class="panel" style="flex: 1">
              <div class="tx-head">
                <h2 style="margin: 0">Giao dịch gần đây</h2>
                <a href="#" id="link-see-all">Xem tất cả</a>
              </div>
              <ul class="tx-list" id="tx-list"></ul>
              <div class="withdraw">
                <p class="withdraw-label">Số dư có thể rút</p>
                <p class="withdraw-value" id="withdraw-balance">—</p>
                <button type="button" class="btn-withdraw" id="btn-withdraw">💳 Rút tiền</button>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/reports.js"></script>
  </body>
</html>
