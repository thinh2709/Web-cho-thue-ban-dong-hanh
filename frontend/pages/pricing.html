<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý bảng giá dịch vụ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-primary: #4facfe;
        --color-primary-dark: #2371b5;
        --color-text: #1a1a2e;
        --color-muted: #666;
        --color-border: #f0f0f0;
        --color-input-border: #e5e5e5;
        --color-header-bg: #f9fafb;
        --color-accent-red: #a33636;
        --glass-bg: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.3);
        --shadow-card: 0 15px 50px rgba(0, 0, 0, 0.15);
        --radius-lg: 20px;
        --radius-md: 10px;
        --radius-sm: 8px;
        --font: 'Inter', system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        color: var(--color-text);
        background: #0f172a;
      }

      .page-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #fff;
      }

      .page-bg img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .page-bg::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(79, 172, 254, 0.35), rgba(0, 242, 254, 0.2));
      }

      .layout {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 80px;
        flex-shrink: 0;
        backdrop-filter: blur(10px);
        background: var(--glass-bg);
        border-right: 1px solid var(--glass-border);
        padding: 24px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .sidebar a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        color: #fff;
        text-decoration: none;
        font-size: 9px;
        gap: 4px;
      }

      .sidebar a .icon {
        font-size: 24px;
        line-height: 1;
      }

      .sidebar a.active {
        background: rgba(255, 255, 255, 0.3);
      }

      .main {
        flex: 1;
        padding: 40px 55px 48px 24px;
        min-width: 0;
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }

      .title {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        color: #fff;
      }

      .btn-add {
        border: none;
        background: #fff;
        color: var(--color-primary);
        font-family: var(--font);
        font-weight: 600;
        font-size: 13.5px;
        padding: 12px 20px;
        border-radius: var(--radius-md);
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      }

      .btn-add:hover {
        filter: brightness(0.98);
      }

      .glass-panel {
        backdrop-filter: blur(10px);
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        margin-bottom: 24px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 20px 24px;
        border-bottom: 1px solid var(--color-border);
        background: rgba(255, 255, 255, 0.92);
      }

      .panel-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 600;
        color: var(--color-text);
        margin: 0;
      }

      .panel-title .emoji {
        font-size: 28px;
      }

      .btn-edit-section {
        border: none;
        background: rgba(79, 172, 254, 0.1);
        color: var(--color-primary-dark);
        font-weight: 600;
        font-size: 12.7px;
        padding: 10px 16px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-family: var(--font);
      }

      .btn-edit-section.secondary {
        background: rgba(79, 172, 254, 0.2);
      }

      .table-wrap {
        overflow-x: auto;
        background: rgba(255, 255, 255, 0.96);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }

      th {
        text-align: left;
        font-size: 12px;
        font-weight: 600;
        color: var(--color-muted);
        text-transform: uppercase;
        padding: 14px 24px;
        background: var(--color-header-bg);
        border-bottom: 1px solid var(--color-border);
      }

      td {
        padding: 16px 24px;
        border-bottom: 1px solid var(--color-border);
        vertical-align: middle;
      }

      .svc-name {
        font-weight: 600;
        font-size: 14px;
        margin: 0 0 4px;
      }

      .svc-desc {
        margin: 0;
        font-size: 12px;
        color: var(--color-accent-red);
      }

      .input-money {
        width: 140px;
        max-width: 100%;
        padding: 10px 12px;
        border: 2px solid var(--color-input-border);
        border-radius: var(--radius-sm);
        font-family: var(--font);
        font-weight: 600;
        font-size: 12px;
        text-align: right;
      }

      .input-money:disabled {
        background: #fafafa;
        color: #333;
      }

      .toggle {
        position: relative;
        width: 44px;
        height: 24px;
        border-radius: 12px;
        border: none;
        padding: 0;
        cursor: pointer;
        flex-shrink: 0;
      }

      .toggle.on {
        background: var(--color-primary);
      }

      .toggle.off {
        background: #e5e5e5;
      }

      .toggle-knob {
        position: absolute;
        top: 2px;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 10px;
        transition: left 0.15s ease;
      }

      .toggle.on .toggle-knob {
        left: 22px;
      }

      .toggle.off .toggle-knob {
        left: 2px;
      }

      .status-cell {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .row-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn-small {
        border: none;
        background: transparent;
        color: var(--color-primary-dark);
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
        font-family: var(--font);
        text-decoration: underline;
      }

      .btn-small.danger {
        color: #b91c1c;
      }

      .settings-panel .settings-inner {
        padding: 20px 24px 16px;
        background: var(--color-header-bg);
        border-bottom: 1px solid var(--color-border);
      }

      .settings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 12px;
      }

      .field label {
        display: block;
        font-size: 12px;
        color: var(--color-muted);
        margin-bottom: 8px;
      }

      .field input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid var(--color-input-border);
        border-radius: var(--radius-md);
        font-family: var(--font);
        font-weight: 600;
        font-size: 16px;
      }

      .settings-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding: 16px 24px;
        background: rgba(255, 255, 255, 0.96);
      }

      .btn-cancel {
        border: none;
        background: #f5f5f5;
        color: var(--color-muted);
        font-weight: 600;
        font-size: 14.5px;
        padding: 12px 20px;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-family: var(--font);
      }

      .btn-save-settings {
        border: none;
        color: #fff;
        font-weight: 600;
        font-size: 13.4px;
        padding: 12px 20px;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-family: var(--font);
        background: linear-gradient(135deg, rgb(79, 172, 254), rgb(0, 242, 254));
      }

      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 12px 18px;
        border-radius: 10px;
        background: #111827;
        color: #fff;
        font-size: 14px;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }

      .toast.show {
        opacity: 1;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 40;
        padding: 16px;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: 100%;
        max-width: 440px;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: var(--shadow-card);
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal h2 {
        margin: 0 0 16px;
        font-size: 20px;
      }

      .modal .field {
        margin-bottom: 14px;
      }

      .modal .field input,
      .modal .field select,
      .modal .field textarea {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid var(--color-input-border);
        border-radius: var(--radius-sm);
        font-family: var(--font);
        font-size: 14px;
      }

      .modal .field textarea {
        min-height: 72px;
        resize: vertical;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }

      .btn-primary {
        border: none;
        background: linear-gradient(135deg, rgb(79, 172, 254), rgb(0, 242, 254));
        color: #fff;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-family: var(--font);
      }

      .btn-ghost {
        border: 1px solid var(--color-input-border);
        background: #fff;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-family: var(--font);
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .loading {
        color: #fff;
        font-size: 14px;
        margin: 8px 0;
      }

      .error-banner {
        background: #fef2f2;
        color: #991b1b;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <img
        src="https://www.figma.com/api/mcp/asset/28591fea-9b91-47dc-81fd-a108ff80c980"
        alt=""
      />
    </div>
    <div class="layout">
      <aside class="sidebar" aria-label="Điều hướng">
        <a href="reports.html" title="Thống kê">
          <span class="icon" aria-hidden="true">📊</span>
          <span>Thống kê</span>
        </a>
        <a href="pricing.html" class="active" title="Giá cả">
          <span class="icon" aria-hidden="true">🏷️</span>
          <span>Giá cả</span>
        </a>
      </aside>
      <main class="main">
        <div class="header-row">
          <h1 class="title">🏷️ Quản lý bảng giá dịch vụ</h1>
          <button type="button" class="btn-add" id="btn-add-service">+ Thêm dịch vụ mới</button>
        </div>
        <div id="status-msg" class="loading" hidden>Đang tải…</div>
        <div id="error-box" class="error-banner" hidden></div>
        <div id="panels"></div>

        <section class="glass-panel settings-panel">
          <div class="settings-inner">
            <p class="svc-name" style="margin-bottom: 4px">⚙️ Cài đặt hoa hồng hệ thống</p>
            <div class="settings-grid">
              <div class="field">
                <label for="fee-companion">Hoa hồng từ Bạn đồng hành (%)</label>
                <input type="number" id="fee-companion" min="0" max="100" step="0.1" />
              </div>
              <div class="field">
                <label for="fee-customer">Phí dịch vụ từ Khách hàng (%)</label>
                <input type="number" id="fee-customer" min="0" max="100" step="0.1" />
              </div>
              <div class="field">
                <label for="fee-late">Phí hủy muộn (%)</label>
                <input type="number" id="fee-late" min="0" max="100" step="0.1" />
              </div>
            </div>
          </div>
          <div class="settings-actions">
            <button type="button" class="btn-cancel" id="btn-commission-reset">Hủy thay đổi</button>
            <button type="button" class="btn-save-settings" id="btn-commission-save">💾 Lưu cài đặt</button>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal">
        <h2 id="modal-title">Thêm dịch vụ</h2>
        <form id="service-form">
          <input type="hidden" id="form-id" />
          <div class="field">
            <label for="form-name">Tên gói / dịch vụ</label>
            <input type="text" id="form-name" required maxlength="120" />
          </div>
          <div class="field">
            <label for="form-desc">Mô tả ngắn</label>
            <textarea id="form-desc" maxlength="500"></textarea>
          </div>
          <div class="field">
            <label for="form-category">Nhóm</label>
            <select id="form-category">
              <option value="basic">Dịch vụ cơ bản</option>
              <option value="premium">Dịch vụ cao cấp</option>
            </select>
          </div>
          <div class="field">
            <label for="form-min">Giá tối thiểu (VNĐ)</label>
            <input type="number" id="form-min" min="0" step="1000" required />
          </div>
          <div class="field">
            <label for="form-max">Giá tối đa (VNĐ)</label>
            <input type="number" id="form-max" min="0" step="1000" />
          </div>
          <div class="field">
            <label for="form-unit">Đơn vị tính</label>
            <input type="text" id="form-unit" value="buổi" maxlength="32" />
          </div>
          <div class="field checkbox-row">
            <input type="checkbox" id="form-public" checked />
            <label for="form-public">Hiển thị công khai (Hoạt động)</label>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-ghost" id="form-cancel">Đóng</button>
            <button type="submit" class="btn-primary" id="form-submit">Lưu</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="../js/api.js"></script>
    <script src="../js/pricing.js"></script>
  </body>
</html>
