<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #2d81c9;
        --white: #ffffff;
        --glass: rgba(217, 217, 217, 0.105);
        --btn-a: #57a7e6;
        --btn-b: #65ace5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
        background: #0f172a;
        color: var(--white);
        overflow-x: hidden;
      }
      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image: linear-gradient(
            to bottom,
            rgba(15, 23, 42, 0.42),
            rgba(15, 23, 42, 0.68)
          ),
          url("/assets/99790-1.png");
        background-size: cover, cover;
        background-position: center, center;
        background-attachment: fixed, fixed;
        background-repeat: no-repeat, no-repeat;
      }
      .page {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      .card {
        width: min(509px, 92vw);
        border-radius: 59px;
        border: 2px solid rgba(255, 255, 255, 1);
        background: var(--glass);
        backdrop-filter: blur(78px);
        -webkit-backdrop-filter: blur(78px);
        padding: 52px 52px 40px;
        box-shadow:
          inset -35px 35px 35px rgba(255, 255, 255, 0.105),
          inset 35px -35px 35px rgba(165, 165, 165, 0.105);
      }
      h1 {
        margin: 0 0 22px;
        font-size: 32px;
        font-weight: 700;
        text-align: center;
      }
      .field {
        margin-top: 18px;
      }
      .field-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 24px;
        font-weight: 400;
        line-height: 28px;
      }
      .field input {
        width: 100%;
        background: transparent;
        color: var(--white);
        border: none;
        outline: none;
        padding: 10px 0 8px;
        font-size: 18px;
      }
      .underline {
        height: 1px;
        width: 100%;
        background: rgba(255, 255, 255, 1);
        margin-top: 4px;
      }
      .row {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
      }
      .checkbox input {
        width: 18px;
        height: 18px;
        accent-color: #ffffff;
      }
      .btn {
        margin-top: 22px;
        width: 100%;
        height: 42px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        background: linear-gradient(180deg, var(--btn-a), var(--btn-b));
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
      }
      .hint {
        margin-top: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 20px;
        font-weight: 600;
      }
      .link {
        color: #ffffff;
        text-decoration: none;
      }
      .link:hover {
        text-decoration: underline;
      }
      .error {
        margin-top: 14px;
        text-align: center;
        font-size: 14px;
        line-height: 18px;
        color: #ffeeee;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="page">
      <form class="card" id="registerForm">
        <h1>Đăng Ký</h1>

        <div class="field">
          <div class="field-label">
            <span>Tên</span>
          </div>
          <input name="name" type="text" autocomplete="name" required />
          <div class="underline"></div>
        </div>

        <div class="field">
          <div class="field-label">
            <span>Email</span>
          </div>
          <input name="email" type="email" autocomplete="email" required />
          <div class="underline"></div>
        </div>

        <div class="field">
          <div class="field-label">
            <span>Mật Khẩu</span>
          </div>
          <input name="password" type="password" autocomplete="new-password" required />
          <div class="underline"></div>
        </div>

        <label class="row checkbox">
          <input type="checkbox" name="terms" required />
          <span>I agree to the terms &amp; conditions</span>
        </label>

        <button class="btn" type="submit">Đăng Ký</button>
        <div class="error" id="errorText"></div>

        <div class="hint">
          <span>Đã Có tài khoản?</span>
          <a class="link" href="./login.html">Đăng Nhập</a>
        </div>
      </form>
    </div>

    <script src="./js/api.js"></script>
    <script>
      const form = document.getElementById("registerForm");
      const errorText = document.getElementById("errorText");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorText.textContent = "";

        const formData = new FormData(form);
        const name = String(formData.get("name") || "").trim();
        const email = String(formData.get("email") || "").trim();
        const password = String(formData.get("password") || "");

        try {
          const data = await window.api.register({ name, email, password });
          window.api.setToken(data.token, true);
          window.location.href = "./index.html";
        } catch (err) {
          errorText.textContent = err?.message || "Có lỗi xảy ra";
        }
      });
    </script>
  </body>
</html>
