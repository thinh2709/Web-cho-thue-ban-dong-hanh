<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Partner - Website thuê bạn đồng hành</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .register-container { background: white; width: 100%; max-width: 600px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .register-header { text-align: center; margin-bottom: 30px; }
        .register-header h1 { color: #2c3e50; font-size: 2rem; margin-bottom: 10px; }
        .register-header p { color: #7f8c8d; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #34495e; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 6px; font-size: 1rem; }
        .form-group input:focus, .form-group textarea:focus { border-color: #3498db; outline: none; }
        
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; background: #f8f9fa; border-radius: 6px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        
        .btn-submit { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #2980b9; transform: translateY(-2px); }
        
        .success-message { display: none; text-align: center; color: #27ae60; background: #eafaf1; padding: 30px; border-radius: 12px; }
        .success-message i { font-size: 4rem; margin-bottom: 20px; }
        
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="register-container" id="formContainer">
        <div class="register-header">
            <h1>🤝 Đăng ký Partner</h1>
            <p>Trở thành người bạn đồng hành tin cậy và chia sẻ trải nghiệm.</p>
        </div>

        <form id="partnerForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <input type="text" id="fullName" placeholder="VD: Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" id="phoneNumber" placeholder="VD: 0912345678" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email liên hệ</label>
                <input type="email" id="email" placeholder="VD: partner@example.com" required>
            </div>

            <div class="form-group">
                <label>Giới thiệu bản thân</label>
                <textarea id="bio" rows="4" placeholder="Chia sẻ đôi chút về bản thân bạn..." required></textarea>
            </div>

            <div class="form-group">
                <label>Kỹ năng / Lĩnh vực đồng hành</label>
                <div class="checkbox-group" id="skillsGroup">
                    <div class="checkbox-item"><input type="checkbox" value="Du lịch"> Du lịch</div>
                    <div class="checkbox-item"><input type="checkbox" value="Thể thao"> Thể thao</div>
                    <div class="checkbox-item"><input type="checkbox" value="Chụp ảnh"> Chụp ảnh</div>
                    <div class="checkbox-item"><input type="checkbox" value="Học tập"> Học tập</div>
                    <div class="checkbox-item"><input type="checkbox" value="Giải trí"> Giải trí</div>
                    <div class="checkbox-item"><input type="checkbox" value="Ẩm thực"> Ẩm thực</div>
                </div>
            </div>

            <div class="form-group">
                <label>Kinh nghiệm (nếu có)</label>
                <input type="text" id="experience" placeholder="VD: 2 năm hướng dẫn du lịch tự túc">
            </div>

            <button type="submit" class="btn-submit">Gửi đơn đăng ký</button>
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                <a href="index.html" style="color: #7f8c8d; text-decoration: none;"><i class="fas fa-arrow-left"></i> Quay lại Trang chủ</a>
            </p>
        </form>
    </div>

    <div class="success-message" id="successMessage">
        <i class="fas fa-check-circle"></i>
        <h2>Đăng ký thành công!</h2>
        <p>Đơn đăng ký của bạn đã được gửi đi. Ban quản trị sẽ sớm liên hệ với bạn qua email/SĐT.</p>
        <button class="btn-submit" style="width: auto; padding: 10px 30px;" onclick="window.location.href='index.html'">Về Trang chủ</button>
    </div>

    <script type="module">
        import api from './js/api.js';

        const form = document.getElementById('partnerForm');
        const formContainer = document.getElementById('formContainer');
        const successMessage = document.getElementById('successMessage');

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            const skills = [];
            document.querySelectorAll('#skillsGroup input:checked').forEach(cb => skills.push(cb.value));
            
            if (skills.length === 0) {
                alert('Vui lòng chọn ít nhất một kỹ năng!');
                return;
            }

            const data = {
                fullName: document.getElementById('fullName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                email: document.getElementById('email').value,
                bio: document.getElementById('bio').value,
                experience: document.getElementById('experience').value,
                skills: skills
            };

            try {
                const result = await api.registerPartner(data);
                if (result._id) {
                    formContainer.style.display = 'none';
                    successMessage.style.display = 'block';
                } else {
                    alert('Có lỗi xảy ra: ' + (result.message || 'Vui lòng thử lại sau.'));
                }
            } catch (error) {
                alert('Lỗi kết nối server!');
            }
        };
    </script>
</body>
</html>
