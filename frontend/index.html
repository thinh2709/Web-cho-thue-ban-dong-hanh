<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website thuê bạn đồng hành</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #2d81c9;
        color: #fff;
      }
      .wrap {
        max-width: 720px;
        padding: 24px;
        text-align: center;
      }
      a {
        color: #fff;
      }
      .links {
        display: flex;
        gap: 16px;
        justify-content: center;
        margin-top: 16px;
      }
      .btn {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 10px;
        background: linear-gradient(180deg, #57a7e6, #65ace5);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Website thuê bạn đồng hành</h1>
      <p>Đi tới màn hình cần đăng nhập hoặc đăng ký.</p>
      <div class="links">
        <a class="btn" href="./login.html">Đăng Nhập</a>
        <a class="btn" href="./register.html">Đăng Ký</a>
      </div>
    </main>
  </body>
</html>
