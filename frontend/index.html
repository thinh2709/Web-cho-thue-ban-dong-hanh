<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thuê bạn đồng hành</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/">Thuê <span>bạn đồng hành</span></a>
        <nav class="nav" aria-label="Chính">
          <a href="/" aria-current="page">Trang chủ</a>
          <a href="/profile.html">Hồ sơ</a>
          <a href="/my-bookings.html">Booking của tôi</a>
        </nav>
      </div>
    </header>
    <main>
      <h1 class="page-title">Xin chào</h1>
      <p class="lead">
        Khu vực dành cho người thuê: cập nhật hồ sơ và xem các booking bạn đã đặt.
      </p>
      <div class="grid-hero">
        <div class="tile">
          <h2>Quản lý hồ sơ</h2>
          <p>Họ tên, số điện thoại và ảnh đại diện (URL).</p>
          <a class="btn btn--primary" href="/profile.html">Mở hồ sơ</a>
        </div>
        <div class="tile">
          <h2>Booking của tôi</h2>
          <p>Xem lịch, hủy hoặc chỉnh sửa khi còn ở trạng thái chờ.</p>
          <a class="btn btn--primary" href="/my-bookings.html">Xem booking</a>
        </div>
      </div>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
