<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hồ sơ — Thuê bạn đồng hành</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/">Thuê <span>bạn đồng hành</span></a>
        <nav class="nav" aria-label="Chính">
          <a href="/">Trang chủ</a>
          <a href="/profile.html" aria-current="page">Hồ sơ</a>
          <a href="/my-bookings.html">Booking của tôi</a>
        </nav>
      </div>
    </header>
    <main>
      <h1 class="page-title">Hồ sơ của bạn</h1>
      <p class="lead">Thông tin dùng để liên hệ khi đặt lịch. Ảnh đại diện: dán URL ảnh công khai.</p>

      <div class="card profile-layout">
        <div class="avatar-wrap">
          <img id="avatar-preview" class="avatar-preview" alt="" hidden width="160" height="160" />
          <p class="muted" style="margin-top: 0.75rem; font-size: 0.85rem">Xem trước ảnh</p>
        </div>
        <form id="profile-form">
          <label class="field">
            <span class="field__label">Họ và tên</span>
            <input class="input" name="fullName" type="text" autocomplete="name" maxlength="120" />
          </label>
          <label class="field">
            <span class="field__label">Số điện thoại</span>
            <input class="input" name="phone" type="tel" autocomplete="tel" maxlength="20" />
          </label>
          <label class="field">
            <span class="field__label">URL ảnh đại diện</span>
            <input class="input" name="avatar" type="url" placeholder="https://..." />
          </label>
          <div class="form-actions">
            <button class="btn btn--primary" type="submit">Lưu thay đổi</button>
          </div>
          <p id="profile-message" class="form-message" role="status"></p>
        </form>
      </div>
    </main>
    <script type="module" src="/js/profile.js"></script>
  </body>
</html>
